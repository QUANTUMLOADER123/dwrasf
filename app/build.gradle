plugins { id 'com.android.application' }

android {
    namespace 'com.quantumloader123.afterglow'
    compileSdk 36

    defaultConfig {
        applicationId 'com.quantumloader123.afterglow'
        minSdk 23
        targetSdk 36
        def releaseVersion = System.getenv('VERSION_NAME') ?: '1.0.0'
        def versionParts = releaseVersion.tokenize('.').collect { it.toInteger() }
        if (versionParts.size() != 3) throw new GradleException('VERSION_NAME must use major.minor.patch, for example 1.0.0')
        versionCode versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
        versionName releaseVersion
    }

    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_BASE64')) {
                def keystoreFile = file("${rootProject.projectDir}/upload-key.p12")
                keystoreFile.bytes = System.getenv('ANDROID_KEYSTORE_BASE64').decodeBase64()
                storeFile keystoreFile
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'afteryou'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_BASE64')) signingConfig signingConfigs.release
        }
        debug { applicationIdSuffix '.debug' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
