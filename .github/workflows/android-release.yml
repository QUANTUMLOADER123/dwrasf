name: Build Android release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: false
        default: 1.0.0
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run game source checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          assert '<script>' in html and '</script>' in html
          assert 'fonts.googleapis.com' not in html
          Path('/tmp/game.js').write_text(html.split('<script>', 1)[1].split('</script>', 1)[0])
          PY
          node --check /tmp/game.js
          node --check app/src/main/assets/locales.js
          node - <<'NODE'
          global.window = {};
          require('./app/src/main/assets/locales.js');
          const codes = Object.keys(window.GAME_LOCALES);
          if (codes.length !== 34) throw new Error(`Expected 34 locales, got ${codes.length}`);
          for (const [code, strings] of Object.entries(window.GAME_LOCALES)) {
            if (Object.keys(strings).length !== 48 || Object.values(strings).some(value => !value)) {
              throw new Error(`Incomplete translations for ${code}`);
            }
          }
          NODE
      - name: Install Android 16 SDK
        run: |
          test -n "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android command-line tools missing under $ANDROID_HOME" >&2
            exit 1
          fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set version
        env:
          DISPATCH_VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$DISPATCH_VERSION" >> "$GITHUB_ENV"
          fi
      - name: Build Android packages
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease bundleRelease
          mkdir -p release-files
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            cp app/build/outputs/apk/release/*.apk release-files/PosleTebya.apk
            cp app/build/outputs/bundle/release/*.aab release-files/PosleTebya.aab
            printf '%s\n' 'Release APK and AAB are signed with the stable Play upload key.' > release-files/BUILD-NOTES.txt
          else
            cp app/build/outputs/apk/debug/*.apk release-files/PosleTebya-test.apk
            cp app/build/outputs/apk/release/*.apk release-files/PosleTebya-release-unsigned.apk
            cp app/build/outputs/bundle/release/*.aab release-files/PosleTebya-release-unsigned.aab
            printf '%s\n' 'No GitHub signing secrets are configured. The test APK is debug-signed; release APK/AAB are unsigned and cannot be uploaded to Google Play. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to publish signed production packages.' > release-files/BUILD-NOTES.txt
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PosleTebya-Android
          path: release-files/*
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK and AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" release-files/* --clobber
